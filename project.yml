name: Tally

options:
  bundleIdPrefix: com.owaismunawar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # No team is committed. Simulator builds sign locally; for a device, set
    # DEVELOPMENT_TEAM in Xcode or pass it to xcodebuild.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # CloudKit sync is opt-in. To enable it, add TALLY_CLOUDKIT here, set a team,
    # and add the iCloud entitlements described in docs/ARCHITECTURE.md (ADR-006).
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)

packages:
  TallyCore:
    path: Packages/TallyCore
  TallyData:
    path: Packages/TallyData
  TallyIntelligence:
    path: Packages/TallyIntelligence
  TallyUI:
    path: Packages/TallyUI

targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: TallyCore
      - package: TallyData
      - package: TallyIntelligence
      - package: TallyUI
      - target: TallyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaismunawar.tally
        PRODUCT_NAME: Tally
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Tally uses Face ID to keep your finances locked when you leave the app.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleURLTypes:
          - CFBundleURLName: com.owaismunawar.tally
            CFBundleURLSchemes:
              - tally
    entitlements:
      path: App/Tally.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.owaismunawar.tally

  TallyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: TallyCore
      - package: TallyData
      - package: TallyUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaismunawar.tally.widgets
        PRODUCT_NAME: TallyWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tally Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/TallyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.owaismunawar.tally

  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
      - path: Config/Tally.storekit
        buildPhase: resources
    dependencies:
      - target: Tally
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaismunawar.tally.tests
        # StoreKitTest's own headers use StoreKit 1 types deprecated in iOS 18, which
        # warnings-as-errors would reject while importing the module. Only the
        # clang importer is relaxed; Swift warnings in this target stay errors.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -Wno-deprecated-declarations
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tally.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tally
        BUNDLE_LOADER: $(TEST_HOST)

  TallyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaismunawar.tally.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tally

schemes:
  Tally:
    build:
      targets:
        Tally: all
        TallyTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Tally.storekit
      commandLineArguments:
        "-demoData": true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TallyTests
        - package: TallyCore/TallyCoreTests
        - package: TallyData/TallyDataTests
        - package: TallyIntelligence/TallyIntelligenceTests
    archive:
      config: Release

  TallyUITests:
    build:
      targets:
        Tally: all
        TallyUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Tally.storekit
    test:
      config: Debug
      targets:
        - TallyUITests
