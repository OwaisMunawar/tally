included:
  - App
  - Shared
  - Widgets
  - AppTests
  - UITests
  - Packages/TallyCore/Sources
  - Packages/TallyCore/Tests
  - Packages/TallyData/Sources
  - Packages/TallyData/Tests
  - Packages/TallyIntelligence/Sources
  - Packages/TallyIntelligence/Tests
  - Packages/TallyUI/Sources

excluded:
  - build
  - "**/.build"

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - legacy_multiple
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - todo
  - trailing_comma

line_length:
  warning: 150
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

identifier_name:
  excluded: [id, to, x, y]

type_body_length:
  warning: 300

file_length:
  warning: 450

cyclomatic_complexity:
  ignores_case_statements: true

function_body_length:
  warning: 80

force_unwrapping:
  severity: error

force_try:
  severity: error
